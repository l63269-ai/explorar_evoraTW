<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Agente</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header">
        <h1>Eventos</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="login.html">Entrar</a>
        </nav>
    </div>
    <div id="content">
        <div id="events"></div>
    </div>
    <div id="footer">
        <p>Trabalho realizado na <a href="https://www.uevora.pt">Universidade de Évora</a></p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        var agentId;
        verifyAuth();
        displayAllEvents();

        function verifyAuth()
        {
            let cookie = getCookie();

            if(cookie!= undefined){
                agentId = isAgent(cookie);
                if(agentId==undefined){
                    window.location.href = "index.html";
                }
            }
        }


        function displayEvents(evs)
        {   
            let ctx = document.getElementById("events");
            
            let eventCount = evs.length;
            
            for(let i=0;i<eventCount;i++)
            {
                let id = evs[i].id;
                let nome = evs[i].name;
                let location = evs[i].location;
                let address = location.address;
                let lat = location.lat;
                let lng = location.lng;
                let datetime = evs[i].datetime;
                let duration = evs[i].duration;
                let description = evs[i].description;
                let agent_id = evs[i].agent_id;
                
                const campos = [
                    ["Morada:", address],
                    ["Data:", datetime],
                    ["Duração:", duration],
                    ["Descrição:", description],
                    ["Agente:", agent_id]
                ];
                if(agentId == agent_id){
                    const card = document.createElement("div");
                    card.className = "event";
                    const h2 = document.createElement("h2");
                    const link = document.createElement("a");
                    link.href = `event.html?id=${id}`;
                    link.textContent = nome;
                    h2.append(link);
                    card.append(h2);
                    for(let [label, value] of campos){
                        const p = document.createElement("p");
                        const span = document.createElement("span");
                        span.className = "label";
                        span.textContent = label + " ";
                        p.append(span, value);
                        card.append(p);
                    }
                    ctx.append(card);
                }
                
            }
            
        }
        async function displayAllEvents()
        {
            let i=1;
            let events = await getAllEvents(i);
            while(events.items.length>0){
                displayEvents(events.items);
                i++;
                events = await getAllEvents(i);
            }
            
        }
         async function getAllEvents(pg)
        {
            const response = await fetch('https://magno.di.uevora.pt/tweb/t1/events',{
                method:'POST',
                body: JSON.stringify({ page: pg })
            }
            );
            const data = await response.json();
            console.log(data);
            return data.ok ? data : null;
        }
    </script>
</body>
</html>
