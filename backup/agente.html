<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="header">
    </div>
    <div id="content"></div>
    <div id="footer"></div>

    <script src="js/auth.js"></script>
    <script>
        var agentId;
        verifyAuth();
        displayAllEvents();

        function verifyAuth()
        {
            let cookie = getCookie();

            if(cookie!= undefined){
                agentId = isAgent(cookie);
                if(agentId==undefined){
                    window.location.href = "index.html";
                }
            }
        }


        function displayEvents(evs)
        {   
            let ctx = document.getElementById("content");
            
            let eventCount = evs.length;
            
            for(let i=0;i<eventCount;i++)
            {
                let id = evs[i].id;
                let nome = evs[i].name;
                let location = evs[i].location;
                let address = location.address;
                let lat = location.lat;
                let lng = location.lng;
                let datetime = evs[i].datetime;
                let duration = evs[i].duration;
                let description = evs[i].description;
                let agent_id = evs[i].agent_id;
                
                const campos = [
                    `Address: ${address}`,
                    `Date: ${datetime}`,
                    `Description: ${description}`,
                    `AID: ${agent_id}`
                ];
                if(agentId == agent_id){
                    const nameP = document.createElement("p");
                    const link = document.createElement("a");
                    link.href = `event.html?id=${id}`;
                    link.textContent = nome;
                    nameP.append("Name: ", link);   
                    ctx.append(nameP);
                    for(let text of campos){
                        const p = document.createElement("p");
                        p.textContent= text;
                        ctx.append(p);
                    }
                }
                
            }
            
        }
        async function displayAllEvents()
        {
            let i=1;
            let events = await getAllEvents(i);
            while(events.items.length>0){
                displayEvents(events.items);
                i++;
                events = await getAllEvents(i);
            }
            
        }
         async function getAllEvents(pg)
        {
            const response = await fetch('https://magno.di.uevora.pt/tweb/t1/events',{
                method:'POST',
                body: JSON.stringify({ page: pg })
            }
            );
            const data = await response.json();
            console.log(data);
            return data.ok ? data : null;
        }
    </script>
</body>
</html>
